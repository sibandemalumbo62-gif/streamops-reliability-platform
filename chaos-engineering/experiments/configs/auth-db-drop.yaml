# Auth Service Database Drop Experiment
# This experiment drops database connections for the auth service
# to test the system's ability to handle database failures

id: auth-db-drop-test
name: Auth Database Connection Drop
description: Tests system resilience to auth database connection failures
service: auth

phases:
  - name: Database connection drop
    failure: database-drop
    duration: 20
    description: Drop auth database connections for 20 seconds

expected_impact:
  availability: "80-90%"
  recovery_time: "< 45s"
  error_rate: "< 15%"
