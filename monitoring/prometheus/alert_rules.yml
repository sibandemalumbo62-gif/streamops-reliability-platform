groups:
  - name: streamops_alerts

    rules:

      # Reliability drops below acceptable level
      - alert: LowServiceReliability

        expr: service_reliability_score < 50

        for: 1m

        labels:
          severity: warning

        annotations:
          summary: "Service reliability is low"

          description: >
            Service {{ $labels.service }}
            reliability dropped below 50%.


      # Too many active incidents
      - alert: TooManyActiveIncidents

        expr: active_incidents > 5

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "Too many active incidents"

          description: >
            Active incidents exceeded the allowed threshold.


      # API errors increasing
      - alert: HighAPIErrorRate

        expr: |
          (
            sum(rate(http_requests_total{status=~"4xx|5xx"}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) * 100 > 5

        for: 2m

        labels:
          severity: critical

        annotations:
          summary: "High API error rate"

          description: >
            API error rate is above 5%.


      # Service unavailable
      - alert: IntegrityServiceDown

        expr: up{job="integrity-service"} == 0

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "Integrity service is down"

          description: >
            Prometheus cannot reach the integrity service.