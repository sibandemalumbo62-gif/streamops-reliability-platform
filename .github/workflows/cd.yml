name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [auth_service, catalog_service, playback_service, recommendation_service, notification_service, integrity_service, gateway]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: streamops/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: |
          ./services/${{ matrix.service }}
          ./shared
        file: |
          ./services/${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'
    
    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
    
    - name: Update Kubernetes deployments
      run: |
        kubectl set image deployment/auth-service auth-service=streamops/auth_service:${{ github.sha }} -n streamops
        kubectl set image deployment/catalog-service catalog-service=streamops/catalog_service:${{ github.sha }} -n streamops
        kubectl set image deployment/playback-service playback-service=streamops/playback_service:${{ github.sha }} -n streamops
        kubectl set image deployment/recommendation-service recommendation-service=streamops/recommendation_service:${{ github.sha }} -n streamops
        kubectl set image deployment/notification-service notification-service=streamops/notification_service:${{ github.sha }} -n streamops
        kubectl set image deployment/integrity-service integrity-service=streamops/integrity_service:${{ github.sha }} -n streamops
        kubectl set image deployment/gateway gateway=streamops/gateway:${{ github.sha }} -n streamops
    
    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/auth-service -n streamops --timeout=5m
        kubectl rollout status deployment/catalog-service -n streamops --timeout=5m
        kubectl rollout status deployment/playback-service -n streamops --timeout=5m
        kubectl rollout status deployment/recommendation-service -n streamops --timeout=5m
        kubectl rollout status deployment/notification-service -n streamops --timeout=5m
        kubectl rollout status deployment/integrity-service -n streamops --timeout=5m
        kubectl rollout status deployment/gateway -n streamops --timeout=5m
    
    - name: Verify deployment
      run: |
        kubectl get pods -n streamops
        kubectl get services -n streamops

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-kubernetes
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install httpx pytest
    
    - name: Run smoke tests
      run: |
        python scripts/smoke_tests.py
      env:
        GATEWAY_URL: ${{ secrets.GATEWAY_URL }}

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-kubernetes, smoke-test]
    if: always()
    
    steps:
    - name: Send notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Deployment completed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
