name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [auth_service, catalog_service, playback_service, recommendation_service, notification_service, integrity_service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
    
    - name: Run tests
      run: |
        cd services/${{ matrix.service }}
        pytest app/tests/ -v
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./services/${{ matrix.service }}/coverage.xml
        flags: ${{ matrix.service }}
        name: codecov-${{ matrix.service }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Run flake8
      run: |
        flake8 services/ gateway/ shared/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 services/ gateway/ shared/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run black
      run: |
        black --check services/ gateway/ shared/
    
    - name: Run isort
      run: |
        isort --check-only services/ gateway/ shared/

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    strategy:
      matrix:
        service: [auth_service, catalog_service, playback_service, recommendation_service, notification_service, integrity_service, gateway]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        if [ "${{ matrix.service }}" == "gateway" ]; then
          docker build -t streamops/${{ matrix.service }}:${{ github.sha }} ./gateway
        else
          docker build -t streamops/${{ matrix.service }}:${{ github.sha }} ./services/${{ matrix.service }}
        fi
    
    - name: Run Trivy on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: streamops/${{ matrix.service }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-docker-${{ matrix.service }}.sarif'
    
    - name: Upload Trivy Docker results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-docker-${{ matrix.service }}.sarif'
