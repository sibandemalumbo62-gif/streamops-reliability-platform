# Pod Disruption Budgets for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: streamops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
---
