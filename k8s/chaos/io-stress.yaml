# Chaos Engineering: I/O Stress Experiment
# This experiment increases disk I/O to test system resilience
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: io-stress-catalog-service
  namespace: streamops
spec:
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: catalog-service
  stressors:
    disk:
      workers: 2
      size: "10MB"
  duration: "30s"
  scheduler:
    cron: "@every 60m"
