# Chaos Engineering: Memory Stress Experiment
# This experiment increases memory usage to test system resilience
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-notification-service
  namespace: streamops
spec:
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: notification-service
  stressors:
    memory:
      workers: 4
      size: "256MB"
  duration: "30s"
  scheduler:
    cron: "@every 40m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-integrity-service
  namespace: streamops
spec:
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: integrity-service
  stressors:
    memory:
      workers: 2
      size: "128MB"
  duration: "20s"
  scheduler:
    cron: "@every 50m"
