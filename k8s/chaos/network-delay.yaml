# Chaos Engineering: Network Delay Experiment
# This experiment introduces network latency to test system resilience
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-gateway
  namespace: streamops
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: gateway
  delay:
    latency: "200ms"
    jitter: "50ms"
    correlation: "25"
  direction: to
  duration: "30s"
  scheduler:
    cron: "@every 15m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-auth-service
  namespace: streamops
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: auth-service
  delay:
    latency: "100ms"
    jitter: "25ms"
    correlation: "25"
  direction: both
  duration: "20s"
  scheduler:
    cron: "@every 20m"
