# Chaos Engineering: CPU Stress Experiment
# This experiment increases CPU load to test system resilience
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-playback-service
  namespace: streamops
spec:
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: playback-service
  stressors:
    cpu:
      workers: 4
      load: 80
  duration: "30s"
  scheduler:
    cron: "@every 30m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-recommendation-service
  namespace: streamops
spec:
  mode: one
  selector:
    namespaces:
      - streamops
    labelSelectors:
      app: recommendation-service
  stressors:
    cpu:
      workers: 2
      load: 60
  duration: "20s"
  scheduler:
    cron: "@every 45m"
