apiVersion: v1
kind: ConfigMap
metadata:
  name: streamops-config
  namespace: streamops
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: streamops-secrets
  namespace: streamops
type: Opaque
stringData:
  POSTGRES_USER: streamops
  POSTGRES_PASSWORD: streamops_password
  SECRET_KEY: streamops-production-secret-key-change-me
  JWT_ALGORITHM: HS256
