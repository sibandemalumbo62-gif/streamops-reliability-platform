apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: streamops
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: streamops/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: CATALOG_SERVICE_URL
          value: "http://catalog-service:8002"
        - name: PLAYBACK_SERVICE_URL
          value: "http://playback-service:8003"
        - name: RECOMMENDATION_SERVICE_URL
          value: "http://recommendation-service:8004"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:8005"
        - name: INTEGRITY_SERVICE_URL
          value: "http://integrity-service:8006"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: streamops-secrets
              key: SECRET_KEY
        - name: ALGORITHM
          valueFrom:
            secretKeyRef:
              name: streamops-secrets
              key: JWT_ALGORITHM
        - name: RATE_LIMIT_REQUESTS_PER_MINUTE
          value: "100"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: streamops
spec:
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: streamops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
